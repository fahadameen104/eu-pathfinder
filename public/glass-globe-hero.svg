<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">A luminous glass globe with a route to Europe</title>
  <desc id="desc">A dimensional blue and teal globe with a glowing travel route and floating compass rose.</desc>
  <defs>
    <radialGradient id="ocean" cx="34%" cy="24%" r="78%">
      <stop offset="0" stop-color="#b9fff1" stop-opacity=".9"/>
      <stop offset=".16" stop-color="#45d9cf" stop-opacity=".85"/>
      <stop offset=".55" stop-color="#167e9b" stop-opacity=".94"/>
      <stop offset="1" stop-color="#07172e"/>
    </radialGradient>
    <linearGradient id="glassEdge" x1="220" y1="120" x2="660" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#effffb" stop-opacity=".92"/>
      <stop offset=".26" stop-color="#a2fff0" stop-opacity=".48"/>
      <stop offset=".64" stop-color="#54c9d2" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffe0a1" stop-opacity=".72"/>
    </linearGradient>
    <linearGradient id="continent" x1="340" y1="210" x2="570" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f6d69a"/>
      <stop offset=".44" stop-color="#f5b866"/>
      <stop offset="1" stop-color="#b76b45"/>
    </linearGradient>
    <linearGradient id="route" x1="396" y1="372" x2="527" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffd88b"/>
      <stop offset=".52" stop-color="#fff4ca"/>
      <stop offset="1" stop-color="#79ffdf"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#53e7d8" stop-opacity=".26"/>
      <stop offset="1" stop-color="#53e7d8" stop-opacity="0"/>
    </radialGradient>
    <filter id="orbShadow" x="84" y="41" width="752" height="704" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur in="SourceAlpha" stdDeviation="27"/>
      <feOffset dy="26"/>
      <feColorMatrix values="0 0 0 0 0.005 0 0 0 0 0.055 0 0 0 0 0.12 0 0 0 .58 0"/>
      <feComposite in2="SourceAlpha" operator="out"/>
      <feGaussianBlur stdDeviation="4"/>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
    <filter id="glow" x="268" y="124" width="440" height="474" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="sphere">
      <circle cx="474" cy="353" r="218"/>
    </clipPath>
  </defs>
  <ellipse cx="481" cy="362" rx="365" ry="329" fill="url(#halo)"/>
